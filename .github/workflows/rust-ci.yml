name: Rust & Java CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Java Payload + Rust Native Components
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Java Injection Payload
        shell: pwsh
        run: .\gradlew.bat clean injectionJar verifyInjectionPayload --stacktrace

      - name: Run Rust Tests
        shell: pwsh
        working-directory: native
        run: |
          cargo test --workspace --verbose
          cargo run -p vape421_bootstrap_test -- standalone
          cargo run -p vape421_bootstrap_test -- handoff
          cargo run -p vape421_bootstrap_test -- invalid

      - name: Build Rust Native Components (Release)
        shell: pwsh
        working-directory: native
        run: cargo build --workspace --release

      - name: Assemble Rust Distribution Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/rust-injection
          Copy-Item -Path native/target/release/Vape421Native.dll -Destination build/rust-injection/ -Force
          Copy-Item -Path native/target/release/Vape421Injector.exe -Destination build/rust-injection/ -Force
          Copy-Item -Path native/target/release/Vape421LunarDump.dll -Destination build/rust-injection/ -Force
          Copy-Item -Path build/libs/*-injection.jar -Destination build/rust-injection/ -Force
          Copy-Item -Path native/README.md -Destination build/rust-injection/ -Force

      - name: Upload Rust Injection Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-rust-injection-bundle
          path: build/rust-injection/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Java Payload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-injection-payload
          path: build/libs/*-injection.jar
          if-no-files-found: error
          retention-days: 14
